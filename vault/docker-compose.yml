services:
  coordinator:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    container_name: vault-coordinator
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - RUNNING_IN_DOCKER=true
      - STORAGE_NODES=node-1:8001,node-2:8002,node-3:8003,node-4:8004,node-5:8005
      - HEALTH_CHECK_INTERVAL=5
    ports:
      - "8000:8000"
    volumes:
      - coordinator-data:/app/data/coordinator
    depends_on:
      - node-1
      - node-2
      - node-3
      - node-4
      - node-5
    networks:
      - vault-net
    restart: unless-stopped
  node-1:
    build:
      context: ./storage_node
      dockerfile: Dockerfile
    container_name: vault-node-1
    environment:
      - NODE_ID=node-1
      - NODE_PORT=8001
      - NODE_DATA_DIR=/data
    ports:
      - "8001:8001"
    volumes:
      - node-1-data:/data
    networks:
      - vault-net
    restart: unless-stopped
  node-2:
    build:
      context: ./storage_node
      dockerfile: Dockerfile
    container_name: vault-node-2
    environment:
      - NODE_ID=node-2
      - NODE_PORT=8002
      - NODE_DATA_DIR=/data
    ports:
      - "8002:8002"
    volumes:
      - node-2-data:/data
    networks:
      - vault-net
    restart: unless-stopped
  node-3:
    build:
      context: ./storage_node
      dockerfile: Dockerfile
    container_name: vault-node-3
    environment:
      - NODE_ID=node-3
      - NODE_PORT=8003
      - NODE_DATA_DIR=/data
    ports:
      - "8003:8003"
    volumes:
      - node-3-data:/data
    networks:
      - vault-net
    restart: unless-stopped
  node-4:
    build:
      context: ./storage_node
      dockerfile: Dockerfile
    container_name: vault-node-4
    environment:
      - NODE_ID=node-4
      - NODE_PORT=8004
      - NODE_DATA_DIR=/data
    ports:
      - "8004:8004"
    volumes:
      - node-4-data:/data
    networks:
      - vault-net
    restart: unless-stopped
  node-5:
    build:
      context: ./storage_node
      dockerfile: Dockerfile
    container_name: vault-node-5
    environment:
      - NODE_ID=node-5
      - NODE_PORT=8005
      - NODE_DATA_DIR=/data
    ports:
      - "8005:8005"
    volumes:
      - node-5-data:/data
    networks:
      - vault-net
    restart: unless-stopped
  vault-node-6:
    build:
      context: ./storage_node
      dockerfile: Dockerfile
    container_name: vault-node-6
    environment:
      - NODE_ID=node-6
      - NODE_PORT=8006
      - NODE_DATA_DIR=/data
    ports:
      - "8006:8006"
    volumes:
      - node-6-data:/data
    networks:
      vault-net:
        aliases:
          - node-6
    restart: unless-stopped
  frontend:
    environment:
      - COORDINATOR_HOSTPORT=coordinator:8000
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vault-frontend
    ports:
      - "3000:3000"
    depends_on:
      - coordinator
    networks:
      - vault-net
    restart: unless-stopped
networks:
  vault-net:
    driver: bridge
volumes:
  coordinator-data:
  node-1-data:
  node-2-data:
  node-3-data:
  node-4-data:
  node-5-data:
  node-6-data:
